<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Sidebar</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2L20.5 9L17 22H7L3.5 9L12 2Z" fill="#D97757"/>
        <path d="M12 2L20.5 9L17 22H7L3.5 9L12 2Z" fill="url(#logoGrad)" opacity="0.6"/>
        <defs>
          <linearGradient id="logoGrad" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#E8956D"/>
            <stop offset="100%" stop-color="#C4603A"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="header-title">Prompt Assistant</span>
    </div>
    <span id="dbBadge" class="db-badge" title="Database status"></span>
    <button id="clearAllBtn" class="icon-btn" title="Clear all history">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 4h4M5 7h10l-1 10H6L5 7z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <!-- Model selector — hidden until /providers returns 2+ options -->
  <div class="model-bar" id="modelBar" style="display:none">
    <span class="model-bar-label">Model</span>
    <select id="providerSelect" class="model-select"></select>
  </div>

  <!-- Chat messages area -->
  <main class="main" id="mainArea">
    <div id="chatMessages" class="chat-messages">
      <p class="empty-state" id="emptyState">No messages yet.<br>Type a prompt below and press Send.</p>
    </div>
  </main>

  <!-- Input area -->
  <footer class="footer">
    <div id="pageBar" class="page-bar" style="display:none">
      <span class="page-bar-dot"></span>
      <span id="pageBarText"></span>
    </div>
    <div class="input-wrapper">
      <textarea
        id="promptInput"
        class="prompt-textarea"
        placeholder="Write your prompt here…"
        rows="3"
        spellcheck="true"
      ></textarea>
      <div class="input-actions">
        <span id="charCount" class="char-count">0</span>
        <div class="action-buttons">
          <button id="clearBtn" class="text-btn">Clear</button>
          <button id="sendBtn" class="send-btn" title="Send (Ctrl+Enter)">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 10h14M10 3l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Send
          </button>
        </div>
      </div>
    </div>
    <p class="hint">Ctrl+Enter to send · Click a prompt to reuse</p>
  </footer>

  <!-- Toast notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="sidebar.js"></script>
</body>
</html>
